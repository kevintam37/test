<style>

.navwrap{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}.navbox{width:28px;height:28px;border-radius:7px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}.navbox.cur{border-color:var(--indigo);box-shadow:0 0 0 2px var(--indigo) inset}.navbox.done{background:var(--line);color:var(--ink);opacity:.75}.navbox.done.ok{background:rgba(42,157,143,.28);border-color:var(--teal);opacity:1}.navbox.done.no{background:rgba(255,107,74,.28);border-color:var(--coral);opacity:1}

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><pattern id="stripe" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="var(--indigo)" stroke-width="3"/></pattern></defs></svg>

<h1>CogAT Practice - 3rd Grade</h1><p class="sub" id="sub"></p>
<div class="stage" id="st"></div>

<script>
/* ---------- random helpers (seeded so a set stays the same until "New questions") ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function makeRng(seed){const f=mulberry32(seed>>>0);const o={f,int:(a,b)=>a+Math.floor(f()*(b-a+1)),pick:arr=>arr[Math.floor(f()*arr.length)],shuffle:arr=>{const x=arr.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(f()*(i+1));const t=x[i];x[i]=x[j];x[j]=t}return x},sample:(arr,k)=>o.shuffle(arr).slice(0,k)};return o}
const cap=w=>w.charAt(0).toUpperCase()+w.slice(1);
const art=w=>(/^[aeiou]/i.test(w)?'an ':'a ')+w;
const list=a=>a.length<3?a.join(' and '):a.slice(0,-1).join(', ')+', and '+a[a.length-1];
const pills=ws=>`<div class="pics">${ws.map(w=>`<div class="pic" style="font-size:18px;font-weight:700;padding:8px 14px">${w}</div>`).join('')}</div>`;

/* build a 5-choice question: 1 correct + 4 unique wrong answers, shuffled */
function mk(R,q,correct,dist,exp,extra,sortNum){
 const c=String(correct),seen=new Set([c]),d=[];
 for(const x of dist){const s=String(x);if(!seen.has(s)){seen.add(s);d.push(s)}if(d.length===4)break}
 if(d.length<4)throw new Error('need 4 distractors');
 let opts=[c,...d];opts=sortNum?opts.sort((a,b)=>a-b):R.shuffle(opts);
 return Object.assign({t:'mc',q,opts,a:opts.indexOf(c),exp},extra||{});
}
function gather(n,fn){const out=[],seen=new Set();let tries=0;while(out.length<n&&tries++<600){let q=null;try{q=fn()}catch(e){q=null}if(!q)continue;const k=q.q+'|'+(q.pics||'')+'|'+q.opts.join('|');if(seen.has(k))continue;seen.add(k);out.push(q)}if(out.length<n)throw new Error('could not generate '+n);return out}

/* ---------- VERBAL ANALOGIES ---------- */
const REL=[
 {pairs:[['hot','cold'],['up','down'],['big','small'],['happy','sad'],['fast','slow'],['day','night'],['open','closed'],['full','empty'],['light','dark'],['old','young'],['wet','dry'],['early','late'],['loud','quiet'],['wide','narrow'],['tall','short'],['in','out'],['win','lose'],['begin','end']],why:(a,b)=>`${cap(a)} and ${b} are opposites.`},
 {pairs:[['wheel','car'],['page','book'],['petal','flower'],['branch','tree'],['finger','hand'],['key','keyboard'],['wing','bird'],['chimney','house'],['toe','foot'],['string','guitar'],['sleeve','shirt'],['blade','knife']],why:(a,b)=>`${cap(art(a))} is a part of ${art(b)}.`},
 {pairs:[['pencil','write'],['knife','cut'],['broom','sweep'],['paintbrush','paint'],['key','unlock'],['oven','bake'],['eraser','erase'],['ruler','measure'],['needle','sew'],['shovel','dig']],why:(a,b)=>`You use ${art(a)} to ${b}.`},
 {pairs:[['bird','nest'],['bee','hive'],['spider','web'],['cow','barn'],['dog','doghouse'],['rabbit','burrow'],['ant','anthill'],['fish','pond']],why:(a,b)=>`${cap(art(a))}'s home is called ${art(b)}.`},
 {pairs:[['dog','puppy'],['cat','kitten'],['cow','calf'],['sheep','lamb'],['duck','duckling'],['horse','foal'],['frog','tadpole'],['bear','cub']],why:(a,b)=>`${cap(art(b))} is a baby ${a}.`},
 {pairs:[['apple','fruit'],['carrot','vegetable'],['robin','bird'],['shark','fish'],['rose','flower'],['oak','tree'],['table','furniture'],['piano','instrument'],['car','vehicle'],['ant','insect'],['hammer','tool'],['shirt','clothing'],['triangle','shape'],['dime','coin']],why:(a,b)=>`${cap(art(a))} is a kind of ${b}.`},
 {pairs:[['teacher','school'],['doctor','hospital'],['farmer','farm'],['chef','kitchen'],['pilot','airplane'],['librarian','library'],['sailor','ship'],['firefighter','firehouse'],['mechanic','garage']],why:(a,b)=>`${cap(art(a))}'s workplace is ${art(b)}.`}
];
function genVA(R,n){return gather(n,()=>{
 const rel=R.pick(REL),two=R.sample(rel.pairs,2),[a,b]=two[0],[c,d]=two[1];
 const others=rel.pairs.map(p=>p[1]).filter(x=>x!==d&&x!==b);
 const dist=[b,...R.shuffle(others)];
 return mk(R,`Choose the word that completes the analogy.\n<b>${cap(a)}</b> is to <b>${b}</b> as <b>${c}</b> is to ______.`,d,dist,`${rel.why(a,b)} The second pair works the same way: ${rel.why(c,d)} So the answer is “${d}”.`);
})}

/* ---------- SENTENCE COMPLETION ---------- */
const SC=[
["The pond froze into solid ____ on the coldest night of winter.","ice",["steam","sand","grass","smoke"],"Water freezes into ice when it gets very cold."],
["After running in the hot sun, the dog was very ____.","thirsty",["square","frozen","silent","painted"],"Running in the heat makes you thirsty."],
["A caterpillar will grow wings and become a ____.","butterfly",["tadpole","puppy","spider","snake"],"A caterpillar changes into a butterfly."],
["Plants need sunlight and ____ to grow.","water",["candy","plastic","noise","paint"],"Plants need water and sunlight to grow."],
["The sun rises in the morning and ____ in the evening.","sets",["grows","floats","melts","sings"],"The sun rises and then it sets."],
["Because it was raining, we opened our ____ to stay dry.","umbrellas",["pillows","pencils","sandwiches","mailboxes"],"Umbrellas keep you dry in the rain."],
["The librarian asked everyone to whisper because the library must be ____.","quiet",["loud","messy","windy","colorful"],"People whisper in a place that should be quiet."],
["Mia put on her coat and mittens because the weather was ____.","cold",["hot","warm","sandy","tasty"],"You wear a coat and mittens when it is cold."],
["To find out how long a desk is, you can use a ____.","ruler",["clock","thermometer","calendar","spoon"],"A ruler measures length."],
["A thermometer tells you how hot or cold it is, and a clock tells you the ____.","time",["weight","length","color","sound"],"A clock tells time."],
["The farmer woke up early to milk the ____.","cows",["clouds","rocks","shoes","windows"],"Farmers milk cows."],
["We could see our breath in the air because it was so ____ outside.","cold",["hot","warm","sweet","quiet"],"Your breath shows up as a little cloud when the air is cold."],
["The little boy was so tired that he fell ____ as soon as he got into bed.","asleep",["awake","sweet","wet","sharp"],"A very tired person falls asleep."],
["A baker uses an oven to ____ bread.","bake",["freeze","paint","read","sing"],"An oven is used to bake."],
["We plant seeds in the spring so that flowers will ____ in the summer.","bloom",["melt","shrink","bark","snow"],"Flowers bloom."],
["Honey tastes ____, but lemons taste sour.","sweet",["loud","heavy","narrow","tall"],"Sweet is the opposite of sour."],
["A turtle moves slowly, but a cheetah runs very ____.","fast",["slow","slowly","heavy","sleepy"],"The word “but” tells us a cheetah is the opposite of slow."],
["The top shelf was too high for {n} to reach, so {n} stood on a ____.","stool",["cloud","feather","puddle","shadow"],"A stool is something you can safely stand on."],
["The movie was so funny that everyone in the room started to ____.","laugh",["sleep","freeze","shiver","whisper"],"Funny things make people laugh."],
["A scientist uses a microscope to look at very ____ things.","tiny",["huge","distant","heavy","noisy"],"A microscope makes tiny things easy to see."],
["The bakery smelled wonderful because fresh bread was ____ in the oven.","baking",["swimming","freezing","singing","growing"],"Bread bakes in an oven."],
["Ice cream will ____ if you leave it out in the hot sun.","melt",["freeze","grow","bark","stretch"],"Heat makes ice cream melt."],
["An elephant is much ____ than a mouse.","bigger",["smaller","lighter","shorter","thinner"],"An elephant is bigger than a mouse."],
["Water that falls from the clouds in small drops is called ____.","rain",["sand","wind","dust","smoke"],"Rain is water that falls from clouds."],
["After the storm, a beautiful ____ appeared in the sky with many colors.","rainbow",["shadow","mountain","sandwich","whistle"],"A rainbow has many colors and appears in the sky."],
["We use our ears to hear and our eyes to ____.","see",["taste","smell","walk","jump"],"Eyes are for seeing."],
["The fire truck raced down the street with its ____ flashing.","lights",["pillows","carrots","pencils","shoelaces"],"Fire trucks have flashing lights."],
["We arrived at the movie early, so we found good ____.","seats",["fur","ink","milk","wind"],"People find seats at a movie."],
["The box was small, but it was surprisingly ____ because it was full of books.","heavy",["light","empty","soft","clear"],"Books are heavy, so a box full of them is heavy."],
["Many birds fly south in the fall to escape the cold ____.","winter",["summer","picnic","sunshine","beach"],"Winter is the cold season."],
["The detective searched the room for ____ to solve the mystery.","clues",["balloons","pillows","carrots","mittens"],"Detectives look for clues."],
["Our class collected canned food to help neighbors who were ____.","hungry",["plastic","striped","shiny","square"],"Food helps people who are hungry."],
["Before crossing the street, always look both ways to stay ____.","safe",["loud","purple","empty","sleepy"],"Looking both ways keeps you safe."],
["The class cleaned the park so that it would look neat and ____.","clean",["dirty","messy","muddy","noisy"],"Cleaning makes a place neat and clean."],
["A spider spins a ____ to catch insects.","web",["nest","hive","den","pond"],"Spiders make webs."],
["On the hottest day of summer, we cooled off by jumping into the ____.","pool",["oven","fireplace","desert","blanket"],"A pool is a cool place to jump on a hot day."],
["The students raised their hands because they wanted to ____ a question.","ask",["bake","bounce","paint","fold"],"You raise your hand to ask a question."]
];
const NAMES=['Sam','Maya','Leo','Ava','Noah','Zoe','Ben','Lily','Ella','Max'];
function genSC(R,n){const items=R.sample(SC,n);return items.map(it=>{const nm=R.pick(NAMES);const stem=it[0].replace(/\{n\}/g,nm).replace('____','______');
 return mk(R,`Which word best completes the sentence?\n${stem}`,it[1],R.shuffle(it[2]),`The best answer is “${it[1]}”. ${it[3]}`)})}

/* ---------- VERBAL CLASSIFICATION ---------- */
const CATS=[
 {n:'animals',o:'animal',d:'an',w:['dog','cat','horse','cow','pig','sheep','rabbit','lion','tiger','bear','deer','goat','elephant','monkey']},
 {n:'birds',o:'bird',d:'an',w:['robin','eagle','owl','duck','sparrow','penguin','parrot','hawk','crow','swan']},
 {n:'insects',o:'insect',d:'an',w:['ant','bee','beetle','butterfly','ladybug','grasshopper','mosquito','cricket','wasp','dragonfly']},
 {n:'fruits',o:'fruit',d:'fo',w:['apple','banana','pear','melon','mango','strawberry','pineapple','kiwi','watermelon']},
 {n:'vegetables',o:'vegetable',d:'fo',w:['carrot','celery','broccoli','potato','onion','spinach','corn','pea','cabbage','lettuce']},
 {n:'drinks',o:'drink',d:'fo',w:['milk','juice','water','tea','lemonade','cocoa','soda']},
 {n:'colors',o:'color',d:'co',w:['red','blue','green','yellow','purple','pink','brown','black','white','gray']},
 {n:'furniture',o:'furniture',d:'fu',w:['table','chair','sofa','bed','desk','shelf','dresser','stool','bench']},
 {n:'clothing',o:'clothing',d:'cl',w:['shirt','pants','socks','jacket','hat','shoes','dress','gloves','scarf','boots','coat']},
 {n:'tools',o:'tool',d:'it',w:['hammer','saw','wrench','screwdriver','drill','pliers','shovel','rake']},
 {n:'kitchen items',o:'kitchen item',d:'it',w:['spoon','fork','knife','plate','bowl','cup','pan','kettle','whisk','spatula']},
 {n:'school supplies',o:'school supply',d:'it',w:['pencil','eraser','notebook','ruler','crayon','marker','glue','folder','backpack','stapler']},
 {n:'vehicles',o:'vehicle',d:'ve',w:['car','bus','truck','train','bicycle','airplane','boat','helicopter','motorcycle','van']},
 {n:'musical instruments',o:'musical instrument',d:'mi',w:['piano','guitar','drum','flute','violin','trumpet','harp','trombone']},
 {n:'body parts',o:'body part',d:'bp',w:['arm','leg','elbow','knee','ankle','wrist','shoulder','finger','toe','ear','nose','chin']},
 {n:'weather',o:'weather',d:'we',w:['rain','snow','wind','fog','storm','hail','sunshine','thunder']},
 {n:'shapes',o:'shape',d:'sh',w:['circle','square','triangle','rectangle','oval','diamond','hexagon','pentagon']},
 {n:'sports',o:'sport',d:'sp',w:['soccer','tennis','baseball','hockey','basketball','golf','swimming','volleyball','football','bowling']},
 {n:'buildings',o:'building',d:'bu',w:['house','school','library','hospital','store','museum','barn','castle','garage']}
];
function genVC(R,n){return gather(n,()=>{
 const X=R.pick(CATS),others=CATS.filter(c=>c.d!==X.d);
 if(R.f()<.5){
  const w=R.sample(X.w,4),grp=w.slice(0,3),ans=w[3];
  const dist=R.sample(others,4).map(c=>R.pick(c.w));
  return mk(R,'Which word belongs with this group?',ans,dist,`${cap(list(grp))} are all ${X.n}. ${cap(ans)} is also a type of ${X.o}.`,{pics:pills(grp)});
 }
 const four=R.sample(X.w,4),Y=R.pick(others),odd=R.pick(Y.w);
 return mk(R,'Which word does NOT belong with the others?',odd,four,`${cap(list(four))} are all ${X.n}. ${cap(odd)} is a type of ${Y.o}, so it does not belong.`);
})}

/* ---------- NUMBER ANALOGIES ---------- */
function genNA(R,n){return gather(n,()=>{
 const op=R.pick(['add','sub','mul','div','mul','add']);let k,a,c,e,f,rule,sym;
 const f3=(ar)=>R.sample(ar,3);
 if(op==='add'){k=R.int(2,12);[a,c,e]=f3([...Array(20)].map((_,i)=>i+1));f=x=>x+k;rule=`add ${k}`;sym='+'}
 else if(op==='sub'){k=R.int(2,9);[a,c,e]=f3([...Array(22)].map((_,i)=>i+k+1));f=x=>x-k;rule=`subtract ${k}`;sym='−'}
 else if(op==='mul'){k=R.int(2,9);[a,c,e]=f3([1,2,3,4,5,6,7,8,9]);f=x=>x*k;rule=k===2?'multiply by 2 (double)':`multiply by ${k}`;sym='×'}
 else{k=R.int(2,5);[a,c,e]=f3([2,3,4,5,6,7,8,9,10].map(x=>x*k));f=x=>x/k;rule=`divide by ${k}`;sym='÷'}
 const ans=f(e);
 const cands=R.shuffle([ans+1,ans-1,ans+2,ans-2,ans+3,e+k,Math.abs(e-k),e*k].filter(x=>x>0&&x!==ans&&Number.isInteger(x)));
 return mk(R,'Find the rule that changes the first number into the second number in each pair. Then use the same rule to find the missing number.',ans,cands,`The rule is “${rule}”: ${a} ${sym} ${k} = ${f(a)} and ${c} ${sym} ${k} = ${f(c)}. So ${e} ${sym} ${k} = ${ans}.`,{pics:pills([`${a} → ${f(a)}`,`${c} → ${f(c)}`,`${e} → ?`])},true);
})}

/* ---------- NUMBER PUZZLES ---------- */
function genNP(R,n){return gather(n,()=>{
 const t=R.int(1,7);let eq,ans,exp,ask='Find the missing number.';
 if(t===1){const a=R.int(3,15),x=R.int(2,15);eq=`${a} + ? = ${a+x}`;ans=x;exp=`${a+x} − ${a} = ${x}.`}
 else if(t===2){const a=R.int(3,12),b=R.int(2,12),c=R.int(2,9);ans=a+b-c;if(ans<1)return null;eq=`${a} + ${b} = ? + ${c}`;exp=`${a} + ${b} = ${a+b}, and ${a+b} − ${c} = ${ans}.`}
 else if(t===3){const a=R.int(12,30),b=R.int(2,9),c=R.int(2,9);ans=a-b-c;if(ans<1)return null;eq=`${a} − ? = ${b} + ${c}`;exp=`${b} + ${c} = ${b+c}, and ${a} − ${b+c} = ${ans}.`}
 else if(t===4){const x=R.int(3,15);eq=`□ + □ = ${2*x}`;ans=x;ask='Both boxes hold the same number. What number is in the box?';exp=`${x} + ${x} = ${2*x}.`}
 else if(t===5){const x=R.int(2,9);eq=`△ + △ + △ = ${3*x}`;ans=x;ask='Each triangle is the same number. What number is the triangle?';exp=`${x} + ${x} + ${x} = ${3*x}.`}
 else if(t===6){const a=R.int(2,9),x=R.int(2,9);eq=`${a} × ? = ${a*x}`;ans=x;exp=`${a*x} ÷ ${a} = ${x}.`}
 else{const p=R.int(2,12),x=R.int(3,12);eq=`● + ■ = ${p+x}   and   ● = ${p}`;ans=x;ask='What number is ■?';exp=`${p+x} − ${p} = ${x}.`}
 const cands=R.shuffle([ans+1,ans-1,ans+2,ans-2,ans+3,ans+4,ans+10,ans*2].filter(x=>x>0&&x!==ans));
 return mk(R,ask,ans,cands,exp,{pics:`<div class="pics"><div class="pic" style="font-size:22px;font-weight:700;padding:10px 16px">${eq}</div></div>`},true);
})}

/* ---------- NUMBER SERIES ---------- */
function genNS(R,n){return gather(n,()=>{
 const t=R.int(1,7);let terms,ans,exp;
 if(t===1){const k=R.int(2,9),s=R.int(1,15);terms=[0,1,2,3,4].map(i=>s+k*i);ans=s+5*k;exp=`The numbers go up by ${k} each time, so ${terms[4]} + ${k} = ${ans}.`}
 else if(t===2){const k=R.int(2,8),s=R.int(40,70);terms=[0,1,2,3,4].map(i=>s-k*i);ans=s-5*k;exp=`The numbers go down by ${k} each time, so ${terms[4]} − ${k} = ${ans}.`}
 else if(t===3){const s=R.int(1,10);terms=[s,s+1,s+3,s+6,s+10];ans=s+15;exp=`The amount added grows: +1, +2, +3, +4, so next is +5. ${terms[4]} + 5 = ${ans}.`}
 else if(t===4){const a=R.int(1,5);let b=R.int(2,6);if(a===b)b++;const s=R.int(2,12);const t1=s+a,t2=t1+b,t3=t2+a,t4=t3+b;terms=[s,t1,t2,t3,t4];ans=t4+a;exp=`The pattern is +${a}, +${b}, +${a}, +${b}, so next is +${a}. ${t4} + ${a} = ${ans}.`}
 else if(t===5){const s=R.int(1,3);terms=[s,2*s,4*s,8*s,16*s];ans=32*s;exp=`Each number is double the one before it. ${16*s} × 2 = ${ans}.`}
 else if(t===6){const s=R.int(1,2);terms=[s,3*s,9*s,27*s];ans=81*s;exp=`Each number is 3 times the one before it. ${27*s} × 3 = ${ans}.`}
 else{const da=R.int(1,3),db=R.int(2,5),a0=R.int(1,9),b0=R.int(20,40);terms=[a0,b0,a0+da,b0+db,a0+2*da];ans=b0+2*db;exp=`There are two patterns mixed together. The 1st, 3rd, and 5th numbers go up by ${da}. The 2nd, 4th, and 6th numbers go up by ${db}, so ${b0+db} + ${db} = ${ans}.`}
 const last=terms[terms.length-1],prev=terms[terms.length-2];
 const cands=R.shuffle([ans+1,ans-1,ans+2,ans-2,ans+3,last+(last-prev),last+1].filter(x=>x>0&&x!==ans));
 return mk(R,'What number comes next in the series?',ans,cands,exp,{pics:`<div class="pics"><div class="pic" style="font-size:21px;font-weight:700;padding:10px 14px">${terms.join(' , ')} , ?</div></div>`},true);
})}

/* ---------- FIGURES (SVG) ---------- */
const poly=(r,pts)=>`<polygon points="${pts.map(p=>(p[0]*r).toFixed(1)+','+(p[1]*r).toFixed(1)).join(' ')}"/>`;
const reg=k=>[...Array(k)].map((_,i)=>[Math.sin(i*2*Math.PI/k),-Math.cos(i*2*Math.PI/k)]);
const SHAPES={
 circle:r=>`<circle r="${r}"/>`,
 square:r=>poly(r,[[-.82,-.82],[.82,-.82],[.82,.82],[-.82,.82]]),
 triangle:r=>poly(r,[[0,-1],[.95,.75],[-.95,.75]]),
 diamond:r=>poly(r,[[0,-1],[.75,0],[0,1],[-.75,0]]),
 pentagon:r=>poly(r,reg(5)),
 hexagon:r=>poly(r,reg(6)),
 arrow:r=>poly(r,[[0,-1],[.7,-.15],[.3,-.15],[.3,1],[-.3,1],[-.3,-.15],[-.7,-.15]]),
 L:r=>poly(r,[[-.7,-.9],[-.1,-.9],[-.1,.3],[.8,.3],[.8,.9],[-.7,.9]])
};
const DOTS={1:[[50,50]],2:[[39,50],[61,50]],3:[[50,38],[38,60],[62,60]],4:[[38,38],[62,38],[38,62],[62,62]]};
function figInner(o){
 const sc={s:.55,m:.8,l:1}[o.size||'m'],r=37*sc;
 const fill=o.fill===1?'var(--indigo)':o.fill===2?'url(#stripe)':'none';
 let g=`<g transform="translate(50 50) rotate(${o.rot||0})" fill="${fill}" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round">${SHAPES[o.shape](r)}</g>`;
 (DOTS[o.dots||0]||[]).forEach(p=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="var(--coral)" stroke="var(--ink)" stroke-width="1.5"/>`});
 return g;
}
const fig=(o,S)=>`<svg width="${S||70}" height="${S||70}" viewBox="0 0 100 100">${figInner(o)}</svg>`;
function gridFig(cells,rows,cols){
 const step=110,W=cols*step;let g='';
 cells.forEach((cell,i)=>{const x=(i%cols)*step+2,y=Math.floor(i/cols)*step+2;
  g+=`<rect x="${x}" y="${y}" width="100" height="100" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>`;
  g+=cell?`<g transform="translate(${x} ${y})">${figInner(cell)}</g>`:`<text x="${x+50}" y="${y+66}" font-size="46" font-weight="800" text-anchor="middle" fill="var(--coral)">?</text>`});
 const w=cols===2?220:270,h=rows===2?220:270;
 return `<div class="pics" style="justify-content:center"><svg width="${w}" height="${h}" viewBox="0 0 ${W} ${rows*step}">${g}</svg></div>`;
}
const SHP=['circle','square','triangle','diamond','pentagon','hexagon'],ASYM=['arrow','L','triangle'],DSH=['circle','square','pentagon','hexagon'];
const FN=['empty','solid','striped'];
const figOpts=arr=>arr.map(o=>fig(o,72));

/* ---------- FIGURE MATRICES ---------- */
function genFM(R,n){return gather(n,()=>{
 if(R.f()<.55){
  const T=R.pick(['fill','rotate','size','dots','both']);let X,Y,Z,A,B,C,ans,dist,exp;
  if(T==='fill'){[X,Y,Z]=R.sample(SHP,3);const f=R.pick([1,2]);A={shape:X};B={shape:X,fill:f};C={shape:Y};ans={shape:Y,fill:f};
   dist=[{shape:Y},{shape:Y,fill:3-f},{shape:X,fill:f},{shape:Z,fill:f},{shape:Y,fill:f,size:'s'},{shape:Z}];
   exp=`The top shape goes from empty to ${FN[f]}. The bottom shape changes the same way.`}
  else if(T==='rotate'){[X,Y,Z]=R.sample(ASYM,3);const ang=R.pick([90,180,270]),oth=[90,180,270].filter(v=>v!==ang);A={shape:X};B={shape:X,rot:ang};C={shape:Y};ans={shape:Y,rot:ang};
   dist=[{shape:Y,rot:oth[0]},{shape:Y,rot:oth[1]},{shape:Y},{shape:X,rot:ang},{shape:Z,rot:ang}];
   exp=`The top shape turns ${ang===90?'a quarter turn':ang===180?'a half turn':'three quarter turns'} clockwise. The bottom shape turns the same way.`}
  else if(T==='size'){[X,Y,Z]=R.sample(SHP,3);const grow=R.f()<.5,s0=grow?'s':'l',s1=grow?'l':'s',fl=R.pick([0,1]);A={shape:X,size:s0,fill:fl};B={shape:X,size:s1,fill:fl};C={shape:Y,size:s0,fill:fl};ans={shape:Y,size:s1,fill:fl};
   dist=[{shape:Y,size:s0,fill:fl},{shape:Y,size:'m',fill:fl},{shape:X,size:s1,fill:fl},{shape:Z,size:s1,fill:fl},{shape:Y,size:s1,fill:1-fl}];
   exp=`The top shape gets ${grow?'bigger':'smaller'}. The bottom shape changes the same way.`}
  else if(T==='dots'){[X,Y,Z]=R.sample(DSH,3);const k=R.pick([2,3]);A={shape:X,size:'l'};B={shape:X,size:'l',dots:k};C={shape:Y,size:'l'};ans={shape:Y,size:'l',dots:k};
   dist=[{shape:Y,size:'l',dots:k+1},{shape:Y,size:'l',dots:k-1},{shape:Y,size:'l'},{shape:X,size:'l',dots:k},{shape:Z,size:'l',dots:k}];
   exp=`The top shape gains ${k} dots. The bottom shape gains ${k} dots too.`}
  else{[X,Y,Z]=R.sample(ASYM,3);const f=R.pick([1,2]),ang=R.pick([90,180,270]),oth=[90,180,270].filter(v=>v!==ang);A={shape:X};B={shape:X,fill:f,rot:ang};C={shape:Y};ans={shape:Y,fill:f,rot:ang};
   dist=[{shape:Y,fill:f},{shape:Y,rot:ang},{shape:Y,fill:3-f,rot:ang},{shape:Y,fill:f,rot:oth[0]},{shape:Z,fill:f,rot:ang}];
   exp=`Two things change: the top shape turns ${ang===90?'a quarter turn':ang===180?'a half turn':'three quarter turns'} clockwise AND becomes ${FN[f]}. The bottom shape must do both.`}
  return mk(R,'The top two figures show a change. Make the same change to the bottom-left figure. Which figure goes in the empty box?',fig(ans,72),figOpts(dist),exp,{fig:1,pics:gridFig([A,B,C,null],2,2)});
 }
 const SHs=R.sample(SHP,3),F=R.shuffle([0,1,2]),SZ=R.f()<.5?R.shuffle(['s','m','l']):null;
 const cell=(r,c)=>({shape:SHs[(r+c)%3],fill:F[r],size:SZ?SZ[c]:'m'});
 const cells=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)cells.push(r===2&&c===2?null:cell(r,c));
 const ans=cell(2,2),dist=[];
 SHs.filter(s=>s!==ans.shape).forEach(s=>dist.push({shape:s,fill:ans.fill,size:ans.size}));
 [0,1,2].filter(f=>f!==ans.fill).forEach(f=>dist.push({shape:ans.shape,fill:f,size:ans.size}));
 if(SZ)['s','m','l'].filter(z=>z!==ans.size).forEach(z=>dist.push({shape:ans.shape,fill:ans.fill,size:z}));
 const exp=`Each row has all three shapes, and every figure in a row has the same fill. The last row is ${FN[ans.fill]}${SZ?', and each column keeps the same size':''}. The shape missing from the last row is the ${ans.shape}.`;
 return mk(R,'Which figure completes the pattern?',fig(ans,72),figOpts(R.shuffle(dist)),exp,{fig:1,pics:gridFig(cells,3,3)});
})}

/* ---------- PAPER FOLDING ---------- */
const PAPER=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--line)" stroke="var(--ink)" stroke-width="2.5"/>`;
const HOLE=(x,y)=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="6.5" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>`;
const DASH=(x1,y1,x2,y2,op)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--ink)" stroke-width="2.5" stroke-dasharray="6 5" opacity="${op||1}"/>`;
const CREASE=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--ink)" stroke-width="6"/>`;
function ARR(x1,y1,x2,y2){const ang=Math.atan2(y2-y1,x2-x1),L=12;const p=[[x2,y2],[x2-L*Math.cos(ang-.5),y2-L*Math.sin(ang-.5)],[x2-L*Math.cos(ang+.5),y2-L*Math.sin(ang+.5)]];
 return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--coral)" stroke-width="4"/><polygon points="${p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="var(--coral)"/>`}
const panel=inner=>`<svg width="86" height="86" viewBox="-4 -4 108 108">${inner}</svg>`;
function unfolded(pts){const s=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);return `<svg width="72" height="72" viewBox="-4 -4 108 108">${PAPER(0,0,100,100)}${DASH(50,0,50,100,.3)}${DASH(0,50,100,50,.3)}${s.map(p=>HOLE(p[0]*100,p[1]*100)).join('')}</svg>`}
function genPF(R,n){return gather(n,()=>{
 const type=R.pick(['v','h','vh','vh']);
 let hx,hy;
 if(type==='v'){hx=R.pick([.62,.75,.88]);hy=R.pick([.2,.35,.65,.8])}
 else if(type==='h'){hx=R.pick([.2,.35,.65,.8]);hy=R.pick([.62,.75,.88])}
 else{hx=R.pick([.62,.75,.88]);hy=R.pick([.62,.75,.88])}
 const P=[hx,hy],Mx=[1-hx,hy],My=[hx,1-hy],Mxy=[1-hx,1-hy];
 let step1,steps=[],correct,cands,exp;
 if(type==='v'){
  steps=[panel(PAPER(0,0,100,100)+DASH(50,0,50,100)+ARR(16,50,80,50)),panel(PAPER(25,0,50,100)+CREASE(25,0,25,100)+HOLE(25+(hx-.5)*100,hy*100))];
  correct=[P,Mx];cands=[[P],[P,My],[P,Mxy],[P,Mx,My,Mxy],[Mx],[P,Mx,My]];
  exp='The paper is folded in half, so the hole goes through two layers. When you unfold it, the hole appears again on the other side of the fold line, like a mirror image.'}
 else if(type==='h'){
  steps=[panel(PAPER(0,0,100,100)+DASH(0,50,100,50)+ARR(50,16,50,80)),panel(PAPER(0,25,100,50)+CREASE(0,25,100,25)+HOLE(hx*100,25+(hy-.5)*100))];
  correct=[P,My];cands=[[P],[P,Mx],[P,Mxy],[P,Mx,My,Mxy],[My],[P,My,Mx]];
  exp='The paper is folded in half, so the hole goes through two layers. When you unfold it, the hole appears again on the other side of the fold line, like a mirror image.'}
 else{
  steps=[panel(PAPER(0,0,100,100)+DASH(50,0,50,100)+ARR(16,50,80,50)),panel(PAPER(25,0,50,100)+CREASE(25,0,25,100)+DASH(25,50,75,50)+ARR(50,16,50,80)),panel(PAPER(25,25,50,50)+CREASE(25,25,25,75)+CREASE(25,25,75,25)+HOLE(25+(hx-.5)*100,25+(hy-.5)*100))];
  correct=[P,Mx,My,Mxy];cands=[[P,Mx],[P,My],[P,Mxy],[P,Mx,My],[P],[Mx,My,Mxy]];
  exp='The paper is folded twice, so the hole goes through four layers. When you unfold it, the hole shows up in all four sections, mirrored across both fold lines.'}
 const pics=`<div class="pics" style="align-items:center;justify-content:center;gap:2px">${steps.join('<span style="font-size:22px;opacity:.6">→</span>')}</div>`;
 return mk(R,'Look at how the paper is folded (the arrows show the folds) and where the hole is punched. Which picture shows the paper after it is unfolded?',unfolded(correct),R.shuffle(cands).map(unfolded),exp,{fig:1,pics});
})}

/* ---------- FIGURE CLASSIFICATION ---------- */
function genFC(R,n){return gather(n,()=>{
 const rule=R.pick(['shape','fill','dots']);let ex,ans,dist,exp;
 if(rule==='shape'){const X=R.pick(SHP),oth=SHP.filter(s=>s!==X);
  ex=R.shuffle([0,1,2]).map(f=>({shape:X,fill:f,size:R.pick(['m','l'])}));
  ans={shape:X,fill:R.pick([0,1,2]),size:R.pick(['m','l'])};
  dist=R.sample(oth,4).map(s=>({shape:s,fill:R.pick([0,1,2]),size:R.pick(['m','l'])}));
  exp=`All three figures are ${X}s, even though their fills are different. Only one choice is ${art(X)}.`}
 else if(rule==='fill'){const f=R.pick([0,1,2]),S3=R.sample(SHP,3),FP=['empty (not colored in)','solid (colored in)','striped'];
  ex=S3.map(s=>({shape:s,fill:f,size:R.pick(['m','l'])}));
  ans={shape:R.pick(SHP),fill:f,size:'m'};
  const of=[0,1,2].filter(x=>x!==f);
  dist=[...Array(8)].map(()=>({shape:R.pick(SHP),fill:R.pick(of),size:R.pick(['m','l'])}));
  exp=`The shapes are all different, but every figure is ${FP[f]}. Only one choice is ${FP[f]}.`}
 else{const k=R.pick([1,2,3]),S3=R.sample(DSH,3);
  ex=S3.map(s=>({shape:s,size:'l',fill:R.pick([0,1]),dots:k}));
  ans={shape:R.pick(DSH),size:'l',fill:R.pick([0,1]),dots:k};
  dist=[0,1,2,3,4].filter(x=>x!==k).map(x=>({shape:R.pick(DSH),size:'l',fill:R.pick([0,1]),dots:x}));
  exp=`Every figure has ${k} dot${k>1?'s':''}. Only one choice has exactly ${k} dot${k>1?'s':''}.`}
 const exs=ex.map(o=>fig(o,76));
 if(exs.includes(fig(ans,76)))return null;
 return mk(R,'These three figures go together. Which figure belongs with them?',fig(ans,72),figOpts(dist),exp,{fig:1,pics:`<div class="pics" style="justify-content:center">${exs.map(s=>`<div class="pic" style="padding:6px">${s}</div>`).join('')}</div>`});
})}

/* ---------- subtests & test sets ---------- */
const SECS=[
 {id:'va',b:0,name:'Verbal Analogies',desc:'Word pairs: “hot is to cold as big is to …?”',gen:genVA},
 {id:'sc',b:0,name:'Sentence Completion',desc:'Pick the word that best finishes the sentence',gen:genSC},
 {id:'vc',b:0,name:'Verbal Classification',desc:'Which word belongs with the group?',gen:genVC},
 {id:'na',b:1,name:'Number Analogies',desc:'Find the number rule and use it',gen:genNA},
 {id:'np',b:1,name:'Number Puzzles',desc:'Find the missing number',gen:genNP},
 {id:'ns',b:1,name:'Number Series',desc:'What number comes next?',gen:genNS},
 {id:'fm',b:2,name:'Figure Matrices',desc:'Which figure completes the pattern?',gen:genFM},
 {id:'pf',b:2,name:'Paper Folding',desc:'Fold, punch a hole, then unfold',gen:genPF},
 {id:'fc',b:2,name:'Figure Classification',desc:'Which figure belongs with the group?',gen:genFC}
];
const BATS=['Verbal Battery','Quantitative Battery','Nonverbal Battery'];
function mkLesson(seed,li,id,name,secs,per){
 const qs=[];
 secs.forEach(s=>{const si=SECS.indexOf(s);const R=makeRng(seed*7919+li*131+si*17+12345);
  s.gen(R,per).forEach(q=>{q.sec=s.name;qs.push(q)})});
 return {id,name,qs};
}
function buildSets(seed){
 const L=[];
 L.push(mkLesson(seed,0,'quick','Quick Daily Check',SECS,2));
 L.push(mkLesson(seed,1,'full','Full Practice Test',SECS,5));
 BATS.forEach((b,i)=>L.push(mkLesson(seed,2+i,'bat'+i,b,SECS.filter(s=>s.b===i),5)));
 SECS.forEach((s,k)=>L.push(mkLesson(seed,5+k,s.id,s.name,[s],10)));
 return L;
}

/* ---------- storage ---------- */
function ls(k,v){try{if(v===undefined)return localStorage.getItem('cogat_'+k);localStorage.setItem('cogat_'+k,v)}catch(e){return null}}
function loadScores(){try{return JSON.parse(ls('scores')||'{}')||{}}catch(e){return {}}}
function saveScore(id,p){const s=loadScores();s[id]=p;ls('scores',JSON.stringify(s))}
const newSeed=()=>1+Math.floor(Math.random()*999999);

/* ---------- quiz engine (same look and feel as the math practice pages) ---------- */
const LT=['Ⓐ','Ⓑ','Ⓒ','Ⓓ','Ⓔ'];
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let seed=0,LES=[],lesson=null,i=0,answered={},pending=null,lastGiven='',selMC=null,timerInt=null;
const optTxt=(q,j)=>q.fig?LT[j]:LT[j]+' '+q.opts[j];
const plain=h=>String(h).replace(/<[^>]*>/g,'');
function stopTimer(){if(timerInt){clearInterval(timerInt);timerInt=null}}
function startTimer(sec){stopTimer();let t=sec;const tick=()=>{const node=$('timer');if(!node){stopTimer();return}const m=Math.floor(t/60),s=t%60;node.textContent=m+':'+(s<10?'0':'')+s;node.style.color=t<=15?'var(--coral)':'var(--indigo)';if(t<=0){stopTimer();return}t--};tick();timerInt=setInterval(tick,1000)}
function home(){stopTimer();lesson=null;$('up').style.display='';
 $('sub').textContent='Reasoning practice in the style of the CogAT · Set #'+seed;
 const sc=loadScores();
 const card=(k,big)=>{const l=LES[k],s=sc[l.id];return `<button class="les${big?' big':''}" onclick="start(${k})"><span>${l.name}</span><small>${l.qs.length} questions${s!=null?' · last score '+s+'%':''}</small></button>`};
 let h=`<div class="newbox"><button class="nb" onclick="newSet()">🔄 New questions</button><div class="small" style="margin-top:8px">Tap for a fresh set of questions any time (daily or weekly). The set stays the same until you tap it again.</div></div>`;
 h+=`<div class="grp">Start here</div><div class="list">${card(0,1)}${card(1,1)}</div>`;
 BATS.forEach((b,bi)=>{h+=`<div class="grp">${b}</div><div class="list">${card(2+bi)}${SECS.map((s,k)=>s.b===bi?`<button class="les" onclick="start(${5+k})"><span>${s.name}</span><small>${s.desc} · 10 questions${sc[s.id]!=null?' · last score '+sc[s.id]+'%':''}</small></button>`:'').join('')}</div>`});
 h+=`<p class="note">The CogAT checks reasoning in three areas: Verbal, Quantitative, and Nonverbal (Grade 3 is Level 9). These practice questions are made up in the same style and are not official test items. There is nothing to memorize: the goal is to get comfortable with each question type.</p>`;
 $('st').innerHTML=h;}
function newSet(){let s=newSeed();while(s===seed)s=newSeed();seed=s;ls('seed',String(seed));LES=buildSets(seed);home();window.scrollTo(0,0)}
function start(k){lesson=k;i=0;answered={};pending=null;lastGiven='';selMC=null;$('up').style.display='none';show();window.scrollTo(0,0)}
function goTo(k){if(lesson===null)return;i=k;show()}
function contFromReview(){const Q=LES[lesson].qs;i=Math.min(i+1,Q.length);show()}
function navBar(Q){let b='';for(let k=0;k<Q.length;k++){const a=answered[k];let cls='navbox';if(k===i)cls+=' cur';if(a)cls+=' done '+(a.ok?'ok':'no');b+=`<button class="${cls}" onclick="goTo(${k})">${k+1}</button>`}return `<div class="navwrap">${b}</div>`}
function next(ok){answered[i]=Object.assign({ok,given:lastGiven},pending||{});lastGiven='';pending=null;i++;show()}
function show(){
 if(lesson===null){home();return}
 const L=LES[lesson],Q=L.qs,s=$('st');selMC=null;
 $('sub').innerHTML=L.name;
 if(i>=Q.length){
  stopTimer();
  let score=0;for(let k=0;k<Q.length;k++){const a=answered[k];if(a&&a.ok)score++}
  const pct=Math.round(score/Q.length*100);saveScore(L.id,pct);
  const rows=Q.map((q,k)=>{const r=answered[k]||{ok:false,given:'(no answer)'};return `<div class="ri ${r.ok?'okr':'nor'}"><div class="rh"><span class="mk">${r.ok?'✓':'✗'}</span> Question ${k+1} · ${esc(q.sec)}</div><div class="rq">${esc(plain(q.q).replace(/\n/g,' ').slice(0,110))}</div><div class="ra"><b>Your answer:</b> ${esc(r.given||'(no answer)')}</div>${r.ok?'':`<div class="rc"><b>Correct answer:</b> ${esc(optTxt(q,q.a))}<br>${esc(q.exp)}</div>`}</div>`}).join('');
  s.innerHTML=`<div class="c"><div class="score">${score}/${Q.length}</div><p><b>Test score: ${pct}%</b><br>${score} correct · ${Q.length-score} wrong</p><p class="small">${L.name}</p><button class="nb" onclick="start(lesson)">Try again</button><button class="nb alt" onclick="newSet();start(${lesson})">New questions, same test</button><button class="nb ghost" onclick="home()">All tests</button></div><h3 class="revh">Review of your answers</h3><div class="rev">${rows}</div>`;return}
 const q=Q[i],locked=answered[i];
 let h=`<button class="back" onclick="home()">← All tests</button>${navBar(Q)}<div class="track"><div class="fill" style="width:${i/Q.length*100}%"></div></div><div class="qn">QUESTION ${i+1} OF ${Q.length} · ${esc(q.sec)}${locked?'':'<span class="timer" id="timer"></span>'}</div><p class="qt">${q.q}</p>${q.pics||''}`;
 h+=`<div class="opts${q.fig?' figs':''}">${q.opts.map((o,j)=>`<button class="opt" id="m${j}" onclick="selectMC(${j})"><b class="lt" id="lt${j}">${LT[j]}</b>${q.fig?o:`<span>${o}</span>`}</button>`).join('')}</div><button class="nb" id="chk" onclick="confirmMC()" disabled>OK</button>`;
 s.innerHTML=h+'<div id="fb"></div>';
 if(locked)applyLock(q,locked);else startTimer(q.fig?90:60);
}
function fin(ok,msg){$('fb').innerHTML=`<div class="fb ${ok?'good':'bad'}">${ok?'Nice work! ':'Not quite — '}${msg}</div><button class="nb alt" onclick="next(${ok})">Next</button>`;const c=$('chk');if(c)c.disabled=true}
function applyLock(q,a){
 stopTimer();
 document.querySelectorAll('.opts .opt').forEach((o,k)=>{o.disabled=true;if(k===q.a)o.classList.add('ok');else if(k===a.sel)o.classList.add('no')});
 const c=$('chk');if(c)c.style.display='none';
 $('fb').innerHTML=`<div class="fb ${a.ok?'good':'bad'}">${a.ok?'✓ You answered this correctly. ':'✗ Not quite. '}${q.exp}</div><div class="row" style="margin-top:10px"><button class="nb alt" onclick="contFromReview()">Continue →</button></div>`;
}
function selectMC(j){selMC=j;document.querySelectorAll('.opts .opt').forEach((o,k)=>o.classList.toggle('sel',k===j));$('chk').disabled=false}
function confirmMC(){if(selMC===null)return;const q=LES[lesson].qs[i],j=selMC;lastGiven=optTxt(q,j);pending={sel:j};document.querySelectorAll('.opts .opt').forEach((o,k)=>{o.disabled=true;o.classList.remove('sel');if(k===q.a)o.classList.add('ok');else if(k===j)o.classList.add('no')});selMC=null;fin(j===q.a,q.exp)}

if(typeof document!=='undefined'&&document.getElementById('st')){
 seed=parseInt(ls('seed'),10)||0;if(!seed){seed=newSeed();ls('seed',String(seed))}
 LES=buildSets(seed);home();
}
</script></body></html>
